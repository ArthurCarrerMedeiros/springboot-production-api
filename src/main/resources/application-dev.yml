spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/springboot_api
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.portfolio.api: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
