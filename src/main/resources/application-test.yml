spring:
  datasource:
    url: jdbc:tc:postgresql:16-alpine:///springboot_api
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

logging:
  level:
    com.portfolio.api: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.testcontainers: INFO